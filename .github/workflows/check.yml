name: check

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run full integration checks for issue completion
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Run checks in the locked contributor environment
        run: nix develop --command bash tools/test.sh ${{ inputs.full && '--full' || '' }}
